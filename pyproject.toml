[project]
name = "multi-agent-debate"
version = "0.1.0"
description = "Local Ollama debates with separate agent contexts and human participation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
